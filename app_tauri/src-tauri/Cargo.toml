[package]
name = "app-tauri-asignador"
version = "0.1.0"
description = "App de escritorio para asignacion biparitaria"
authors = ["Dani F"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "shell-open"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
